    <style>
      text { font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Helvetica Neue", Arial, sans-serif; }
      .flowA { animation: routeA 7.5s linear infinite; }
      .flowB { animation: routeB 8.4s linear infinite; }
      .aiPulse { animation: aiGlow 4.2s ease-in-out infinite; }
      .fanTurn { animation: spin 8s linear infinite; transform-box: view-box; }
      .fanLeft { transform-origin: 994px 320px; }
      .fanRight { transform-origin: 1087px 320px; }
      .guardBeat { animation: guard 3.2s ease-in-out infinite; transform-origin: 1128px 372px; }
      .bubble { fill: #111A35; stroke: #60A5FA; stroke-opacity: 0.72; stroke-width: 3; stroke-linejoin: round; }
      @keyframes routeA { to { stroke-dashoffset: -620; } }
      @keyframes routeB { to { stroke-dashoffset: -650; } }
      @keyframes aiGlow { 0%, 100% { opacity: 0.58; } 50% { opacity: 1; } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes guard { 0%, 100% { opacity: 0.62; } 45% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .flowA, .flowB, .aiPulse, .fanTurn, .guardBeat { animation: none; }
      }
    </style>

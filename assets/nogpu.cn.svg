      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow" cx="0" cy="0" r="1" gradientTransform="translate(866 325) rotate(90) scale(150 390)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <style>
      text { font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Helvetica Neue", Arial, sans-serif; }
      .waitPulse { animation: wait 4.2s ease-in-out infinite; }
      .cloneFlow { animation: flow 7s linear infinite; }
      .copyDots { animation: copy 3.8s ease-in-out infinite; }
      .runFan { animation: spin 8s linear infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes wait { 0%, 100% { opacity: 0.18; } 50% { opacity: 0.52; } }
      @keyframes flow { to { stroke-dashoffset: -72; } }
      @keyframes copy { 0%, 100% { opacity: 0.3; transform: translateX(0); } 55% { opacity: 0.95; transform: translateX(18px); } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .waitPulse, .cloneFlow, .copyDots, .runFan { animation: none; }
      }
    </style>

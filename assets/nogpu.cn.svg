      <stop offset="0.5" stop-color="#172141"/>
      <stop offset="1" stop-color="#0D142B"/>
    </linearGradient>
    <linearGradient id="slot" x1="1090" y1="108" x2="1230" y2="204" gradientUnits="userSpaceOnUse">

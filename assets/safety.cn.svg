  <circle cx="640" cy="172" r="116" fill="none" stroke="#34D399" stroke-opacity="0.08"/>
  <rect x="515" y="112" width="250" height="130" rx="21" fill="#111A35" stroke="#34D399" stroke-opacity="0.7" stroke-width="3"/>

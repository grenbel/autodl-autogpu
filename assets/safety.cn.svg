  <line x1="165" y1="121" x2="165" y2="211" stroke="#FBBF24" stroke-width="7" stroke-linecap="round"/>
  <line x1="287" y1="121" x2="287" y2="211" stroke="#FBBF24" stroke-width="7" stroke-linecap="round"/>
  <line x1="165" y1="125" x2="287" y2="125" stroke="#FBBF24" stroke-width="5" stroke-linecap="round"/>
  <polygon points="174,138 247,125 247,204 174,191" fill="#FBBF24" fill-opacity="0.06" stroke="#FBBF24" stroke-width="4" stroke-linejoin="round"/>

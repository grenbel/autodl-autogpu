  <circle cx="1060" cy="166" r="65" fill="#0A1022" stroke="#FB7185" stroke-width="5"/>
  <circle cx="1060" cy="166" r="52" fill="#FB7185" fill-opacity="0.045" stroke="#FB7185" stroke-opacity="0.26"/>
  <line x1="1060" y1="166" x2="1035" y2="144" stroke="#EEF2FF" stroke-width="6" stroke-linecap="round"/>
  <line class="clockHand" x1="1060" y1="166" x2="1088" y2="130" stroke="#FB7185" stroke-width="6" stroke-linecap="round"/>
  <circle cx="1060" cy="166" r="7" fill="#FB7185"/>
  <path d="M 1022 221 L 1011 237 M 1098 221 L 1109 237" fill="none" stroke="#FB7185" stroke-width="6" stroke-linecap="round"/>
  <text x="1060" y="343" text-anchor="middle" fill="#EEF2FF" font-size="34" font-weight="750">控制台定时关机</text>
  <text x="1060" y="387" text-anchor="middle" fill="#A9B4D6" font-size="26" font-weight="400">到点直接关机，按需设置</text>
</svg>

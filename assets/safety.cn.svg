<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="t d">
  <title id="t">autodl-autogpu 的三重安全控制</title>
  <desc id="d">三个夜色徽章分别显示预算关口、GPU 守护和控制台定时关机。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1022"/>
      <stop offset="0.54" stop-color="#101735"/>
      <stop offset="1" stop-color="#141B3A"/>
    </linearGradient>
    <radialGradient id="amberMedal" cx="0" cy="0" r="1" gradientTransform="translate(186 130) rotate(55) scale(225)">
      <stop offset="0" stop-color="#FBBF24" stop-opacity="0.16"/>
      <stop offset="0.48" stop-color="#18203C" stop-opacity="0.86"/>
      <stop offset="1" stop-color="#080D1C"/>
    </radialGradient>
    <radialGradient id="greenMedal" cx="0" cy="0" r="1" gradientTransform="translate(604 130) rotate(55) scale(225)">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.16"/>
      <stop offset="0.48" stop-color="#18203C" stop-opacity="0.86"/>
      <stop offset="1" stop-color="#080D1C"/>
    </radialGradient>
    <radialGradient id="coralMedal" cx="0" cy="0" r="1" gradientTransform="translate(1024 130) rotate(55) scale(225)">
      <stop offset="0" stop-color="#FB7185" stop-opacity="0.16"/>
      <stop offset="0.48" stop-color="#18203C" stop-opacity="0.86"/>
      <stop offset="1" stop-color="#080D1C"/>
    </radialGradient>
    <style>
      text { font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Helvetica Neue", Arial, sans-serif; }
      .gateGlow { animation: gate 3.8s ease-in-out infinite; }
      .pulseBeat { animation: beat 2.8s ease-in-out infinite; transform-origin: 640px 166px; }
      .clockHand { animation: tick 9s linear infinite; transform-origin: 1060px 166px; }
      @keyframes gate { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.9; } }
      @keyframes beat { 0%, 100% { opacity: 0.58; transform: scale(1); } 45% { opacity: 1; transform: scale(1.035); } }
      @keyframes tick { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .gateGlow, .pulseBeat, .clockHand { animation: none; }
      }
    </style>
  </defs>
  <rect x="1" y="1" width="1278" height="458" rx="28" fill="url(#bg)" stroke="#FFFFFF" stroke-opacity="0.13"/>
  <rect x="2" y="2" width="1276" height="456" rx="27" fill="none" stroke="#60A5FA" stroke-opacity="0.05"/>
  <ellipse cx="220" cy="310" rx="154" ry="22" fill="#020617" fill-opacity="0.4"/>
